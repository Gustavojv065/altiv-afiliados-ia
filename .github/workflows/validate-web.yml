name: Validate ALTIV Web
on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/validate-web.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/validate-web.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
