name: ALTIV Android Beta 9
on:
  pull_request:
    paths: ['android/**', '.github/workflows/build-android-beta9.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android-beta9.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Testar parser de links
        working-directory: android
        run: |
          mkdir -p build/link-tests
          javac -encoding UTF-8 -d build/link-tests app/src/main/java/com/altiv/afiliados/AffiliateLink.java tests/AffiliateLinkTest.java
          java -cp build/link-tests AffiliateLinkTest
      - name: Compilar APK debug
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ALTIV-Afiliados-IA-Beta9
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar beta apos merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta9-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk --title "ALTIV Afiliados IA - Beta 9 ($GITHUB_RUN_NUMBER)" --notes "Central Shopee sem API: navegador seguro, links, legendas, rascunhos locais e WhatsApp assistido." --prerelease
