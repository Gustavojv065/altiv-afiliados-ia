name: Build ALTIV Android Beta 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-v2.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ALTIV-Afiliados-IA-Beta3.apk
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta-3 --yes --cleanup-tag 2>/dev/null || true
          gh release create beta-3 ALTIV-Afiliados-IA-Beta3.apk --title "ALTIV Afiliados IA - Beta 3" --notes "Interface mais intuitiva, onboarding simples, navegação inferior e fluxo Radar > Criar > Publicar."
