plugins { id 'com.android.application' }

android {
    namespace 'com.altiv.afiliados'
    compileSdk 35
    defaultConfig {
        applicationId "com.altiv.afiliados"
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName "0.9.0-beta9"
    }
}

// Chrome Custom Tabs reutiliza a sessão do navegador sem acesso a cookies pelo ALTIV.
dependencies { implementation 'androidx.browser:browser:1.8.0' }
